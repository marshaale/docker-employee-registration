services:
  db:
    image: postgres
    container_name: psql
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - psql-data:/var/lib/postgresql
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    environment:
      - VITE_API_URL=/api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  psql-data:
